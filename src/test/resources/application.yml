spring:
  datasource:
    url: jdbc:h2:mem:cokerthon-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: 8th-cokerthon-test-jwt-secret-key-for-test-runtime
    access-token-expiration-millis: 86400000

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
